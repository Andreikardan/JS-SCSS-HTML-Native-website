<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0",
    user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Future | Home</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <script src="./scripts/main.js" type="module" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="header__promo">
        <div class="header__promo-inner container">
          <a href="/" class="header__promo-link">
            <!-- вопрос к icon стоит ли делать так -->

            <span class="icon--yellow-arrow icon"
              >Подпишитесь на нашу рассылку, чтобы получать последние новости
            </span>
          </a>
        </div>
      </div>
      <div class="header__body">
        <div class="header__body-inner container">
          <a href="/" class="header__logo logo" aria-label="Home" title="Home">
            <img
              src="./images/logo.svg"
              alt=""
              class="logo__image"
              width="179"
              height="50"
            />
          </a>
          <div class="header__overlay">
            <nav class="header__menu">
              <ul class="header__menu-list">
                <li class="header__menu-item">
                  <a href="/" class="header__menu-link is-active">Домой</a>
                </li>
                <li class="header__menu-item">
                  <a href="/" class="header__menu-link">Новости</a>
                </li>
                <li class="header__menu-item">
                  <a href="/" class="header__menu-link">Подкасты</a>
                </li>
                <li class="header__menu-item">
                  <a href="/" class="header__menu-link">Ресурсы</a>
                </li>
              </ul>
            </nav>
            <a href="/" class="header__contact-us-link button button-accent">
              Контакты
            </a>
          </div>
          <button
            class="header__burger-button burger-button visible-mobile"
            type="button"
            aria-label="Open menu"
            title="Открыть меню"
          >
            <span class="burger-button__line"></span>
            <span class="burger-button__line"></span>
            <span class="burger-button__line"></span>
          </button>
        </div>
      </div>
    </header>
  </body>
</html>
